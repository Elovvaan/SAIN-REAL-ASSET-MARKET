<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Verify a SAIN financing authorization reference against current SAIN financing records.">
  <title>Verify Financing Authorization · SAIN</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#171717;background:#f3f3f1}*{box-sizing:border-box}body{margin:0}.shell{max-width:760px;margin:0 auto;padding:48px 20px}.brand{display:flex;align-items:center;gap:14px;margin-bottom:34px}.brand img{width:52px;height:52px;object-fit:contain}.brand strong{display:block;font-size:20px}.brand span{display:block;color:#666;font-size:13px;margin-top:3px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:30px;box-shadow:0 8px 30px rgba(0,0,0,.05)}h1{font-size:27px;margin:0 0 10px}p{line-height:1.55;color:#555}.form{display:flex;gap:10px;margin:24px 0}.form input{flex:1;min-width:0;padding:13px 14px;border:1px solid #bbb;border-radius:8px;font-size:16px;text-transform:uppercase}.form button{border:0;border-radius:8px;background:#171717;color:#fff;padding:0 20px;font-weight:700;cursor:pointer}.form button:disabled{opacity:.55}.result{display:none;margin-top:25px;border-top:1px solid #e5e5e5;padding-top:24px}.result.visible{display:block}.status{font-weight:700;margin-bottom:16px}.status.ok{color:#236b37}.status.bad{color:#9a2d25}.grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #ddd}.grid div{padding:12px 14px;border-bottom:1px solid #eee}.grid span{display:block;color:#777;font-size:10px;text-transform:uppercase;letter-spacing:.07em}.grid strong{display:block;margin-top:4px;font-size:14px;overflow-wrap:anywhere}.notice{margin-top:18px;background:#faf7ed;border-left:4px solid #b68b16;padding:14px;font-size:12px;line-height:1.55;color:#555}.contact{margin-top:20px;font-size:13px;line-height:1.55;color:#555}@media(max-width:600px){.shell{padding:28px 14px}.card{padding:22px}.form{display:block}.form button{width:100%;padding:13px;margin-top:10px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><img src="/brand-logo" alt="SAIN"><div><strong>SAIN Platform</strong><span>Financing Operations</span></div></div>
    <section class="card">
      <h1>Verify Financing Authorization</h1>
      <p>Enter the SAIN financing authorization reference supplied with the transaction. This lookup confirms the current authorization record directly from SAIN Platform.</p>
      <form class="form" id="verify-form">
        <input id="authorization" name="authorization" autocomplete="off" spellcheck="false" placeholder="LFA-XXXXXXXX" aria-label="Financing authorization reference" required>
        <button id="verify-button" type="submit">Verify</button>
      </form>
      <section class="result" id="result" aria-live="polite"></section>
    </section>
  </main>
  <script>
    const form=document.getElementById('verify-form'), input=document.getElementById('authorization'), button=document.getElementById('verify-button'), result=document.getElementById('result');
    const esc=(v)=>String(v??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const money=(amount,currency)=>new Intl.NumberFormat('en-US',{style:'currency',currency:currency||'USD'}).format(Number(amount||0));
    const label=(v)=>String(v||'').replaceAll('_',' ');
    function showError(message){result.className='result visible';result.innerHTML='<div class="status bad">Authorization not verified</div><p>'+esc(message)+'</p>';}
    async function verify(reference){
      button.disabled=true;button.textContent='Verifying…';result.className='result visible';result.innerHTML='<p>Checking current SAIN financing records…</p>';
      try{
        const response=await fetch('/api/financing-closing/verification/'+encodeURIComponent(reference),{headers:{Accept:'application/json'},cache:'no-store'});
        const data=await response.json().catch(()=>({}));
        if(!response.ok||!data.verified){showError('No current posted financing authorization was found for that reference. Check the reference and try again.');return;}
        result.innerHTML='<div class="status ok">✓ Financing authorization verified</div><div class="grid">'+
          '<div><span>Authorization</span><strong>'+esc(data.authorizationReference)+'</strong></div>'+
          '<div><span>Current status</span><strong>'+esc(label(data.financingStatus))+'</strong></div>'+
          '<div><span>Applicant</span><strong>'+esc(data.applicant)+'</strong></div>'+
          '<div><span>Authorized amount</span><strong>'+esc(money(data.amount,data.currency))+'</strong></div>'+
          '<div><span>Opportunity</span><strong>'+esc(data.opportunityReference||'—')+'</strong></div>'+
          '<div><span>Closing</span><strong>'+esc(data.closingReference||'Not yet opened')+'</strong></div></div>'+
          '<div class="notice">'+esc(data.notice)+'</div>'+
          '<div class="contact"><strong>'+esc(data.verificationContact?.organization||'SAIN Platform')+' · '+esc(data.verificationContact?.department||'Financing Operations')+'</strong><br>'+esc(data.verificationContact?.phone||'')+'<br>'+esc(data.verificationContact?.email||'')+'<br>'+esc(data.verificationContact?.address||'')+'</div>';
      }catch(error){showError('Verification service could not be reached. Please try again.');}
      finally{button.disabled=false;button.textContent='Verify';}
    }
    form.addEventListener('submit',(event)=>{event.preventDefault();const reference=input.value.trim().toUpperCase();if(reference)void verify(reference);});
    const supplied=new URLSearchParams(location.search).get('authorization');if(supplied){input.value=supplied.toUpperCase();void verify(input.value);}
  </script>
</body>
</html>
