name: production-smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  live-production-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check deployed SRA production site and API
        env:
          SRA_PRODUCTION_URL: https://www.sainrealasset.com
          SRA_EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/production-smoke-check.mjs
