name: Administration Workspace Audit

on:
  pull_request:
    paths:
      - 'routes/private-admin-router.js'
      - 'routes/financing-closing-router.js'
      - 'services/persistent-domain-service.js'
      - 'services/funding-operations-service.js'
      - 'public/admin/**'
      - 'tests/unified-market-operations-diagnostics.test.mjs'
      - 'tests/persistent-domain-bulk-hydration.test.mjs'
      - 'test/admin-full-workspace-audit.test.js'
      - '.github/workflows/admin-workspace-audit.yml'
  push:
    branches:
      - main
    paths:
      - 'routes/private-admin-router.js'
      - 'routes/financing-closing-router.js'
      - 'services/persistent-domain-service.js'
      - 'services/funding-operations-service.js'
      - 'public/admin/**'
      - 'tests/unified-market-operations-diagnostics.test.mjs'
      - 'tests/persistent-domain-bulk-hydration.test.mjs'
      - 'test/admin-full-workspace-audit.test.js'

jobs:
  admin-workspace-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run administration workspace audit
        run: node --test --test-concurrency=1 test/admin-full-workspace-audit.test.js tests/unified-market-operations-diagnostics.test.mjs tests/persistent-domain-bulk-hydration.test.mjs
